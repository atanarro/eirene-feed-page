<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eirene talks</title>
  <style>
    :root {
      --bg: #f5efe3;
      --paper: #fffaf1;
      --panel: #fdf8ee;
      --ink: #1f1f1b;
      --muted: #6a665d;
      --line: #e3dac6;
      --accent: #356859;
      --accent-soft: #d9ebe5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Georgia", "Times New Roman", serif;
      line-height: 1.5;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2rem;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: end;
      margin-bottom: 1rem;
    }

    h1 {
      margin: 0;
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 1.65rem;
      letter-spacing: 0.02em;
      text-transform: lowercase;
    }

    .sub {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .top-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.65rem;
    }

    .top-link, .link, .time-link {
      color: var(--accent);
      text-underline-offset: 0.15rem;
    }

    .filters {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      padding: 0.9rem;
      margin-bottom: 1rem;
      display: grid;
      gap: 0.8rem;
    }

    .filters-top {
      display: grid;
      gap: 0.35rem;
    }

    .filters h2 {
      margin: 0;
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 1rem;
    }

    .filters-sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.3fr repeat(2, minmax(160px, 0.7fr));
      gap: 0.75rem;
      align-items: end;
    }

    .field {
      display: grid;
      gap: 0.3rem;
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 0.86rem;
      color: var(--muted);
    }

    input[type="search"], input[type="date"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 0.45rem 0.55rem;
    }

    .status {
      margin: 0 0 0.8rem;
      color: var(--muted);
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 0.88rem;
    }

    .cards {
      display: grid;
      gap: 0.85rem;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 0.9rem;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: start;
    }

    .card-copy {
      min-width: 0;
      flex: 1 1 auto;
    }

    .exhibition-thumb {
      width: 88px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--paper);
      flex: 0 0 auto;
    }

    .card-top-cinema {
      align-items: center;
    }

    .card-copy {
      min-width: 0;
      flex: 1 1 auto;
    }

    .poster-thumb {
      width: 64px;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--paper);
      flex: 0 0 auto;
    }

    .card h2 {
      margin: 0;
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 1.08rem;
      line-height: 1.3;
    }

    .card-copy .meta {
      margin-top: 0.25rem;
    }

    .year {
      margin-left: 0.4rem;
      color: var(--muted);
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 0.78rem;
      padding: 0.2rem 0.55rem;
      white-space: nowrap;
    }

    .meta {
      margin: 0.3rem 0 0;
      color: var(--muted);
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 0.88rem;
    }

    .desc {
      margin: 0.6rem 0 0;
      color: var(--ink);
      max-width: 72ch;
    }

    .venue-list {
      display: grid;
      gap: 0.75rem;
      margin-top: 0.8rem;
    }

    .venue-block {
      border-top: 1px solid var(--line);
      padding-top: 0.75rem;
      display: grid;
      gap: 0.45rem;
    }

    .venue-top {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: start;
    }

    .venue-block h3, .language-block h4 {
      margin: 0;
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
    }

    .venue-block h3 { font-size: 0.98rem; }
    .venue-title {
      margin: 0;
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 1rem;
    }
    .language-block h4 { font-size: 0.9rem; color: var(--muted); }

    .venue-cards {
      display: grid;
      gap: 0.8rem;
    }

    .language-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 0.7rem;
    }

    .language-block {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      padding: 0.7rem;
      display: grid;
      gap: 0.5rem;
    }

    .screening-list { display: grid; gap: 0.45rem; }

    .screening {
      border-top: 1px solid var(--line);
      padding-top: 0.45rem;
      display: grid;
      gap: 0.18rem;
    }

    .screening:first-child { border-top: 0; padding-top: 0; }

    .screening-main {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      align-items: baseline;
    }

    .screening-date {
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 0.86rem;
    }

    .screening-meta {
      color: var(--muted);
      font-family: "Source Sans 3", "Inter", "Segoe UI", sans-serif;
      font-size: 0.8rem;
    }

    .screening-desc {
      color: var(--ink);
      font-size: 0.9rem;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 12px;
      background: rgba(255, 250, 241, 0.72);
      padding: 1rem;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    @media (max-width: 840px) {
      .top, .card-top, .screening-main {
        display: grid;
      }

      .card-top-cinema {
        grid-template-columns: 64px 1fr;
      }

      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>talks</h1>
        <p class="sub">Search talks by title, venue, date range, or source.</p>
      </div>
      <nav class="top-links"><a class="top-link" href="index.html">Feed index</a><a class="top-link" href="calendar.html">Calendar</a><a class="top-link" href="exhibition.html">Exhibitions</a><a class="top-link" href="cinema.html">Cinema</a><a class="top-link" href="music.html">Music</a><a class="top-link" href="theater.html">Theater</a></nav>
    </header>

    <section class="filters" aria-label="Search filters">
      <div class="filters-top">
        <h2>Search</h2>
        <p class="filters-sub">Filter by title, venue, date, source, or description.</p>
      </div>
      <div class="controls">
        <label class="field">
          <span>Query</span>
          <input id="query" type="search" placeholder="Search the list">
        </label>
        
          <label class="field">
            <span>Start date</span>
            <input id="start-date" type="date" value="2026-08-10">
          </label>
          <label class="field">
            <span>End date</span>
            <input id="end-date" type="date">
          </label>
        
      </div>
    </section>

    <p class="status" id="status">Loading results…</p>
    <main class="cards" id="cards"></main>
    <p class="empty hidden" id="empty">No talks match the current filters.</p>
  </div>

  <script>
    
const queryInput = document.getElementById("query");
const startInput = document.getElementById("start-date");
const endInput = document.getElementById("end-date");
const cards = [...document.querySelectorAll("[data-card]")];
const groups = [...document.querySelectorAll("[data-group]")];
const status = document.getElementById("status");
const empty = document.getElementById("empty");

function normalizeText(value) {
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function render() {
  const query = normalizeText(queryInput.value.trim());
  const start = startInput.value;
  const end = endInput.value;
  let visible = 0;

  for (const card of cards) {
    const search = card.dataset.search || "";
    const cardStart = card.dataset.start || "";
    const cardEnd = card.dataset.end || "";
    let show = true;

    if (query && !search.includes(query)) {
      show = false;
    }
    if (start && cardEnd < start) {
      show = false;
    }
    if (end && cardStart > end) {
      show = false;
    }

    const dateItems = card.querySelectorAll("[data-date]");
    if (show && dateItems.length) {
      let anyDateVisible = false;
      for (const item of dateItems) {
        const itemDate = item.dataset.date;
        const dateShow = (!start || itemDate >= start) && (!end || itemDate <= end);
        item.classList.toggle("hidden", !dateShow);
        if (dateShow) {
          anyDateVisible = true;
        }
      }
      if (!anyDateVisible) {
        show = false;
      }
      for (const block of card.querySelectorAll(".language-block, .venue-block")) {
        const blockHasVisible = [...block.querySelectorAll("[data-date]")].some(
          (item) => !item.classList.contains("hidden")
        );
        block.classList.toggle("hidden", !blockHasVisible);
      }
    }

    card.classList.toggle("hidden", !show);
    if (show) {
      visible += 1;
    }
  }

  for (const group of groups) {
    const visibleCards = group.querySelectorAll("[data-card]:not(.hidden)");
    group.classList.toggle("hidden", visibleCards.length === 0);
  }

  status.textContent = `${visible} results match the current filters.`;
  empty.classList.toggle("hidden", visible !== 0);
}

for (const input of [queryInput, startInput, endInput]) {
  input.addEventListener("input", render);
  input.addEventListener("change", render);
}

render();

  </script>
</body>
</html>
